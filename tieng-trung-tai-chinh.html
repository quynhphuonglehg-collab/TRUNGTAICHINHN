<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiếng Trung Tài chính – Ngân hàng</title>
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --line:#e6e0d6;
  --red:#b3261e; --red-soft:#f6e3e1; --gold:#a8741a; --green:#2e7d4f; --green-soft:#e3f2e8;
  --blue:#2b5c8a; --blue-soft:#e4edf6; --radius:12px;
  --zh:"PingFang SC","Noto Sans SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --kai:"KaiTi","STKaiti","Kaiti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,var(--zh)}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#fffdf9ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px 12px;padding:10px 16px 6px;flex-wrap:wrap}
.speed{margin-left:auto}
.brand{font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .seal{background:var(--red);color:#fff;border-radius:8px;padding:2px 7px;font-family:var(--kai);font-size:18px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;order:3;flex:1 1 100%;margin:0 -6px}
nav::-webkit-scrollbar{display:none}
nav a{padding:6px 11px;border-radius:999px;text-decoration:none;color:var(--muted);white-space:nowrap;font-size:14px}
nav a:hover{background:#f0ebe2;color:var(--ink)}
nav a.on{background:var(--ink);color:#fff}
.speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.speed input{width:80px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:24px;margin:4px 0 6px} h2{font-size:19px;margin:22px 0 10px} h3{font-size:16px;margin:16px 0 8px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g6{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;color:var(--ink)}
.btn:hover{border-color:#cfc6b8;background:#fbf9f5}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:#9a1f18}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ic{padding:4px 8px;line-height:1}
.btn:disabled{opacity:.5;cursor:default}
select{max-width:100%}
select,input[type=text],input[type=number],textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:110px;resize:vertical}
.zh{font-family:var(--zh)} .kai{font-family:var(--kai)}
.py{color:var(--red);font-size:14px} .vi{color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:#f0ebe2;color:var(--muted)}
.tag.r{background:var(--red-soft);color:var(--red)} .tag.g{background:var(--green-soft);color:var(--green)} .tag.b{background:var(--blue-soft);color:var(--blue)}
.stat{font-size:28px;font-weight:700} .stat small{font-size:13px;font-weight:400;color:var(--muted);display:block}
table{border-collapse:collapse;width:100%} th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top} th{font-size:13px;color:var(--muted);font-weight:600}
.word{cursor:pointer;transition:transform .1s}
.word:hover{transform:translateY(-2px);border-color:#d8cfc1}
.word .hz{font-size:26px;font-family:var(--zh);line-height:1.2}
.big-hz{font-size:64px;font-family:var(--kai);line-height:1.1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* flashcard */
.fc-wrap{perspective:1200px;max-width:520px;margin:10px auto}
.fc{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 6px 24px #0000000d}
.fc .back{transform:rotateY(180deg)}
.fc .hz{font-size:60px;font-family:var(--kai)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:12px auto}
.rate .btn{padding:10px 4px}
.progress{height:6px;background:#ece6dc;border-radius:99px;overflow:hidden;max-width:520px;margin:6px auto}
.progress i{display:block;height:100%;background:var(--red)}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font-size:16px}
.opt:hover{background:#fbf9f5}
.opt.ok{background:var(--green-soft);border-color:var(--green)} .opt.no{background:var(--red-soft);border-color:var(--red)}
.qz{max-width:620px;margin:0 auto}
.prompt-hz{font-size:46px;font-family:var(--kai);text-align:center;margin:10px 0}
/* dialogue */
.bub{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.bub .who{flex:0 0 34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--zh)}
.bub .txt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:78%}
.bub.me{flex-direction:row-reverse} .bub.me .who{background:var(--red-soft);color:var(--red)} .bub.me .txt{background:#fff8f6}
.bub.playing .txt{outline:2px solid var(--gold)}
.bub .hz{font-size:18px;font-family:var(--zh)}
.hidden-line .hz,.hidden-line .py,.hidden-line .vi{filter:blur(6px)}
.nopy .py{display:none} .novi .vi{display:none}
/* hanzi */
.hzbox{width:130px;height:130px;background:#fff;border:1px solid var(--line);border-radius:10px;position:relative}
.hzbox svg{position:absolute;inset:0}
.hzgrid{background-image:linear-gradient(#f0d9d6 1px,transparent 1px),linear-gradient(90deg,#f0d9d6 1px,transparent 1px);background-size:50% 50%;background-position:center}
.writebox{width:280px;height:280px;margin:0 auto}
/* order */
.tok{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;margin:4px;font-family:var(--zh);font-size:18px;cursor:pointer}
.tok.used{opacity:.25;pointer-events:none}
.ans-area{min-height:52px;border:1px dashed #cfc6b8;border-radius:10px;padding:6px;background:#fffdf9}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px}
.fb.ok{background:var(--green-soft);color:var(--green)} .fb.no{background:var(--red-soft);color:var(--red)}
/* modal & toast */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:20px;position:relative}
#modal .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.notice{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5410;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.day{cursor:pointer;text-align:center;padding:12px 8px}
.day b{display:block;font-size:20px}
.day.done{background:var(--green-soft);border-color:#b9dcc6}
.lv-pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:13px}
pre{background:#f4f0e8;border-radius:10px;padding:12px;overflow:auto;font-size:12.5px}
.kbd{font-size:12px;color:var(--muted)}
.tone-card{cursor:pointer;text-align:center}
.tone-card .kai{font-size:44px}
@media (max-width:640px){.big-hz{font-size:50px}.fc .hz{font-size:48px}.prompt-hz{font-size:38px}}
</style>
</head>

ôi muốn sửa phần sự kiện vi phạm ở Điều 8.","day":25},{"hz":"适用法律是越南法律还是英国法律？","py":"Shìyòng fǎlǜ shì Yuènán fǎlǜ háishi Yīngguó fǎlǜ?","vi":"Luật áp dụng là luật Việt Nam hay luật Anh?","day":25},{"hz":"争议解决方式是新加坡仲裁吗？","py":"Zhēngyì jiějué fāngshì shì Xīnjiāpō zhòngcái ma?","vi":"Phương thức giải quyết tranh chấp là trọng tài Singapore phải không?","day":25},{"hz":"双方确认后就可以定稿签署。","py":"Shuāngfāng quèrèn hòu jiù kěyǐ dìnggǎo qiānshǔ.","vi":"Hai bên xác nhận xong là có thể chốt bản và ký.","day":25},{"hz":"这个价格还有商量的空间吗？","py":"Zhège jiàgé hái yǒu shāngliang de kōngjiān ma?","vi":"Mức giá này còn dư địa thương lượng không?","day":26},{"hz":"其他银行给的报价更有竞争力。","py":"Qítā yínháng gěi de bàojià gèng yǒu jìngzhēnglì.","vi":"Báo giá của ngân hàng khác cạnh tranh hơn.","day":26},{"hz":"如果利率能降低二十个基点，我们可以接受。","py":"Rúguǒ lìlǜ néng jiàngdī èrshí ge jīdiǎn, wǒmen kěyǐ jiēshòu.","vi":"Nếu lãi suất giảm được 20bp, chúng tôi có thể chấp nhận.","day":26},{"hz":"我需要向领导请示一下，明天答复您。","py":"Wǒ xūyào xiàng lǐngdǎo qǐngshì yíxià, míngtiān dáfù nín.","vi":"Tôi cần xin ý kiến lãnh đạo, ngày mai sẽ phúc đáp anh/chị.","day":26},{"hz":"我们希望长期合作，实现双赢。","py":"Wǒmen xīwàng chángqī hézuò, shíxiàn shuāngyíng.","vi":"Chúng tôi mong hợp tác lâu dài, cùng có lợi.","day":26},{"hz":"我们想用人民币直接结算，减少汇率风险。","py":"Wǒmen xiǎng yòng rénmínbì zhíjiē jiésuàn, jiǎnshǎo huìlǜ fēngxiǎn.","vi":"Chúng tôi muốn thanh toán trực tiếp bằng CNY để giảm rủi ro tỷ giá.","day":27},{"hz":"贵行能否提供越南盾和人民币的直接报价？","py":"Guì háng néngfǒu tígōng Yuènán dùn hé rénmínbì de zhíjiē bàojià?","vi":"Quý ngân hàng có thể yết giá trực tiếp VND/CNY không?","day":27},{"hz":"我们需要做一笔一年期的远期购汇。","py":"Wǒmen xūyào zuò yì bǐ yì nián qī de yuǎnqī gòuhuì.","vi":"Chúng tôi cần thực hiện một giao dịch mua ngoại tệ kỳ hạn 1 năm.","day":27},{"hz":"款项预计几天到账？","py":"Kuǎnxiàng yùjì jǐ tiān dàozhàng?","vi":"Khoản tiền dự kiến mấy ngày thì về tài khoản?","day":27},{"hz":"这笔外债需要在越南国家银行登记。","py":"Zhè bǐ wàizhài xūyào zài Yuènán Guójiā Yínháng dēngjì.","vi":"Khoản vay nước ngoài này cần đăng ký với NHNN Việt Nam.","day":27},{"hz":"您第一次来河内吗？","py":"Nín dì yī cì lái Hénèi ma?","vi":"Anh/chị đến Hà Nội lần đầu à?","day":29},{"hz":"今天晚上我们请您吃越南菜。","py":"Jīntiān wǎnshang wǒmen qǐng nín chī Yuènán cài.","vi":"Tối nay chúng tôi mời anh/chị ăn món Việt.","day":29},{"hz":"我敬您一杯，感谢贵行的支持！","py":"Wǒ jìng nín yì bēi, gǎnxiè guì háng de zhīchí!","vi":"Tôi mời anh/chị một ly, cảm ơn sự hỗ trợ của quý ngân hàng!","day":29},{"hz":"这是一点儿小心意，请收下。","py":"Zhè shì yìdiǎnr xiǎo xīnyì, qǐng shōuxià.","vi":"Đây là chút tấm lòng, xin anh/chị nhận cho.","day":29},{"hz":"感谢您的照顾，一路顺风！","py":"Gǎnxiè nín de zhàogù, yílù shùnfēng!","vi":"Cảm ơn sự quan tâm của anh/chị, chúc thượng lộ bình an!","day":29},{"hz":"今天主要想和您沟通授信额度的事。","py":"Jīntiān zhǔyào xiǎng hé nín gōutōng shòuxìn édù de shì.","vi":"Hôm nay chủ yếu muốn trao đổi với anh/chị về hạn mức tín dụng.","day":30},{"hz":"我先简单介绍一下我们公司的情况。","py":"Wǒ xiān jiǎndān jièshào yíxià wǒmen gōngsī de qíngkuàng.","vi":"Tôi xin giới thiệu ngắn về tình hình công ty.","day":30},{"hz":"关于利率和费用，我们希望再讨论一下。","py":"Guānyú lìlǜ hé fèiyòng, wǒmen xīwàng zài tǎolùn yíxià.","vi":"Về lãi suất và phí, chúng tôi mong được thảo luận thêm.","day":30},{"hz":"我总结一下今天的会议内容。","py":"Wǒ zǒngjié yíxià jīntiān de huìyì nèiróng.","vi":"Tôi xin tóm tắt nội dung cuộc họp hôm nay.","day":30},{"hz":"下一步我们会尽快提交材料。","py":"Xià yí bù wǒmen huì jǐnkuài tíjiāo cáiliào.","vi":"Bước tiếp theo chúng tôi sẽ nộp hồ sơ sớm nhất.","day":30}],"days":[{"day":1,"title":"Pinyin, thanh điệu, chào hỏi","tips":"Thanh 3 đứng giữa câu chỉ xuống thấp rồi dừng, không vòng lên (giống dấu nặng kéo dài). Dùng 您 thay 你 với mọi đối tác ngân hàng.","exercises":["Nghe: nghe bảng pinyin có âm thanh (tìm \"pinyin chart audio\") 2 lượt, chú ý zh/ch/sh/r và j/q/x.","Nói: đọc mā má mǎ mà và bā bá bǎ bà 10 lượt, ghi âm, so với bản mẫu.","Đọc: đọc to 20 từ chỉ nhìn pinyin, rồi chỉ nhìn chữ Hán.","Viết: viết 你 我 好 是 不 mỗi chữ 10 lần đúng thứ tự nét."],"review":[]},{"day":2,"title":"Bản thân và công ty","tips":"的 đảo thứ tự so với tiếng Việt: EVF的阳 = Dương của EVF. 是 đọc uốn lưỡi \"sờ\" kéo, không phải \"sư\".","exercises":["Nghe: nghe 5 mẫu câu (dán vào Google Dịch, bấm loa) 3 lượt, gạch chân chữ nghe chưa rõ.","Nói: tự giới thiệu 30 giây gồm tên, quốc tịch, công ty, ban, việc phụ trách.","Đọc: đọc to bảng từ, che cột pinyin để tự kiểm tra.","Viết: viết đoạn tự giới thiệu 4 câu bằng chữ Hán."],"review":[]},{"day":3,"title":"Số đếm và hệ 万/亿","tips":"Tách số thành nhóm 4 chữ số từ phải sang (1,5000,0000 = 一亿五千万). 一 đổi thanh: trước thanh 4 đọc yí (一亿 yí yì), trước thanh 1/2/3 đọc yì (一千 yì qiān).","exercises":["Nghe: nhờ người khác hoặc Google Dịch đọc 10 số tiền ngẫu nhiên, bạn viết ra số Ả-rập.","Nói: đọc to số dư nợ của 3 khoản vay bất kỳ bạn đang theo dõi.","Đọc: đọc 5 số: 12.000 · 350.000 · 8.000.000 · 150.000.000 · 2.500.000.000.","Viết: viết 5 số trên bằng chữ Hán (đáp án: 一万两千 · 三十五万 · 八百万 · 一亿五千万 · 二十五亿)."],"review":[]},{"day":4,"title":"Tiền tệ và tỷ giá","tips":"笔 bǐ là lượng từ cho khoản tiền, khoản vay, giao dịch: 一笔贷款 = một khoản vay. 兑 duì trong tỷ giá = \"đổi sang\".","exercises":["Nghe: nghe bản tin tỷ giá ngắn trên kênh CCTV hoặc app 人民银行, chỉ cần bắt được tên tiền tệ và con số.","Nói: đọc tỷ giá USD/CNY, USD/VND, CNY/VND hôm nay thành câu hoàn chỉnh.","Đọc: đọc to 5 mẫu câu, đánh dấu thanh điệu lên từng chữ.","Viết: viết 3 câu hỏi về phí và tỷ giá gửi một ngân hàng."],"review":[]},{"day":5,"title":"Thời gian, ngày tháng, kỳ hạn","tips":"Thời gian xếp từ lớn đến nhỏ, ngược tiếng Việt: năm → tháng → ngày → buổi → giờ. Năm đọc từng chữ số: 2027 = èr líng èr qī.","exercises":["Nghe: nghe Google Dịch đọc 5 ngày tháng bất kỳ, ghi lại dạng số.","Nói: đọc to lịch làm việc tuần này của bạn (ngày + buổi + giờ).","Đọc: đọc ngày đáo hạn của 3 khoản CD hoặc khoản vay bạn đang quản lý.","Viết: viết 3 câu đề xuất giờ họp khác nhau."],"review":[]},{"day":6,"title":"Văn phòng và cuộc họp","tips":"Trao và nhận danh thiếp bằng hai tay, mặt chữ hướng về người nhận, đọc lướt chức danh trước khi cất. 了 le cuối câu báo việc đã xong.","exercises":["Nghe: xem 1 video \"商务中文 交换名片\" (tiếng Trung thương mại – trao danh thiếp) trên YouTube.","Nói: tập mở đầu và kết thúc một cuộc họp bằng câu 3 và 5.","Đọc: đọc to 20 từ, đặt mỗi động từ (发 看 说 听 问) vào 1 câu ngắn.","Viết: viết email 3 câu báo đã gửi tài liệu họp."],"review":[]},{"day":7,"title":"Ôn tập và kiểm tra Tuần 1","tips":"","exercises":[],"review":["20 từ: lọc 20 thẻ Anki bạn bấm \"Again\" nhiều nhất trong tuần, ôn lại cùng câu ví dụ.","5 mẫu câu: ghép câu từ Ngày 1, 2, 3, 6 thành đoạn mở đầu cuộc họp 1 phút: chào → trao danh thiếp → giới thiệu bản thân → nêu số tiền và kỳ hạn cần vay → mời bắt đầu.","Bài tập: làm Bài kiểm tra Tuần 1 ở mục 8, dán bài tự luận vào chat để mình chấm.","Mẹo: ghi âm đoạn 1 phút, nghe lại và đánh dấu mọi chỗ thanh 3 bị đọc vòng lên hoặc zh/z bị lẫn."]},{"day":8,"title":"Ngân hàng và tổ chức tài chính","tips":"行 có hai cách đọc: háng (ngân hàng, ngành) và xíng (được, đi). 贵行 guì háng = \"quý ngân hàng\", cách gọi lịch sự khi nói với đối tác.","exercises":["Nghe: mở trang \"关于我们\" (giới thiệu) trên website ICBC hoặc BOC, dùng chức năng đọc to của trình duyệt, bắt tên ngân hàng và các cấp chi nhánh.","Nói: nói tên đầy đủ và tên tắt của 4 ngân hàng Big 4 trong 10 giây.","Đọc: đọc logo và tên tiếng Trung của 4 ngân hàng trên ảnh tìm kiếm.","Viết: vẽ sơ đồ 总行 → 分行 → 支行 bằng chữ Hán."],"review":[]},{"day":9,"title":"Chức danh và bộ phận","tips":"Gọi đối tác bằng họ + chức danh (王行长, 李经理), không gọi tên riêng. Bộ phận 同业部 thường là đầu mối của ngân hàng khi làm việc với công ty tài chính như EVF.","exercises":["Nghe: nghe 5 câu, chép chính tả pinyin câu 3 và 5.","Nói: giới thiệu sơ đồ tổ chức của EVF: ai là lãnh đạo, bạn thuộc ban nào, báo cáo cho ai.","Đọc: đọc 3 danh thiếp tiếng Trung (tìm ảnh \"银行 名片\"), xác định họ, chức danh, bộ phận.","Viết: thiết kế danh thiếp tiếng Trung của bạn (tên, chức danh, ban, công ty)."],"review":[]},{"day":10,"title":"Hẹn lịch và gặp mặt","tips":"Lặp động từ hoặc thêm 个 làm câu nhẹ và lịch sự: 谈谈, 见个面. 提前 tíqián sẽ gặp lại ở \"trả nợ trước hạn\" (提前还款).","exercises":["Nghe: nhờ mình đóng vai thư ký ngân hàng gọi để dời lịch họp; bạn nghe (đọc) và trả lời.","Nói: tập 3 cách đề xuất giờ họp và 2 cách xin dời lịch.","Đọc: đọc to địa chỉ văn phòng EVF bằng tiếng Trung (tầng, tòa nhà, quận).","Viết: viết tin nhắn WeChat 2 câu xác nhận lịch hẹn."],"review":[]},{"day":11,"title":"Tài khoản và tiền gửi","tips":"活 \"sống\" = linh hoạt, không kỳ hạn; 定 \"định\" = cố định kỳ hạn. 账 zhàng (sổ sách) xuất hiện trong mọi từ về tài khoản: 账户, 账号, 转账, 对账单.","exercises":["Nghe: nghe 5 câu, chép lại câu 2 và 3 bằng chữ Hán.","Nói: đóng vai khách hàng hỏi lãi suất tiền gửi 3, 6, 12 tháng (三个月、六个月、一年).","Đọc: đọc bảng lãi suất tiền gửi trên website BOC (人民币存款利率表), xác định 活期 và 定期.","Viết: điền mẫu thông tin chuyển khoản: 收款人 / 账号 / 开户行 / 金额 / 币种."],"review":[]},{"day":12,"title":"Lãi suất và tỷ lệ","tips":"ü trong 率 lǜ: đặt miệng nói \"i\" rồi chu tròn môi, không đọc thành \"lứ\". 利率 là hai thanh 4 liền nhau: cả hai đều rơi dứt khoát, âm thứ hai thấp hơn.","exercises":["Nghe: tìm tin \"LPR报价\" mới nhất trên trang tin tiếng Trung, nghe hoặc đọc tiêu đề, bắt con số LPR 1 năm và 5 năm.","Nói: so sánh 2 báo giá lãi suất giả định bằng cấu trúc A比B高/低.","Đọc: đọc to 5 mức lãi: 3,85% · 4,2% · SOFR + 150bp · 6,5% · 0,25%.","Viết: viết 2 câu đề nghị ngân hàng giảm lãi suất."],"review":[]},{"day":13,"title":"Email và hồ sơ","tips":"Email tiếng Trung trang trọng mở bằng 尊敬的 + họ + chức danh, kết bằng 此致 (một dòng) rồi 敬礼 (dòng sau, lùi đầu dòng). 件 jiàn = bản/tệp: 附件, 原件, 复印件, 扫描件.","exercises":["Nghe: nghe Google Dịch đọc 5 câu, chép câu 4.","Nói: gọi điện giả định báo ngân hàng đã gửi hồ sơ (dùng câu 2 và 5).","Đọc: đọc một danh mục hồ sơ vay (tìm \"贷款申请材料清单\"), đánh dấu những từ đã biết.","Viết: viết email hoàn chỉnh 5 dòng gửi hồ sơ bổ sung, có 尊敬的 và 此致 / 敬礼."],"review":[]},{"day":14,"title":"Ôn tập và kiểm tra Tuần 2","tips":"","exercises":[],"review":["20 từ: 20 thẻ Anki khó nhất của Tuần 2, ưu tiên tên ngân hàng, chức danh và từ về lãi suất.","5 mẫu câu: ghép thành cuộc gọi 2 phút: chào 王经理 → hẹn gặp → hỏi lãi suất tiền gửi 1 năm → hỏi cố định hay thả nổi → báo sẽ gửi hồ sơ qua email.","Bài tập: làm Bài kiểm tra Tuần 2 (mục 8), rồi nhập vai cuộc gọi trên với mình trong chat.","Mẹo: nếu một từ sai 3 lần trong Anki, viết một câu riêng có từ đó về công việc thật của bạn và thêm vào mặt sau thẻ."]},{"day":15,"title":"Khoản vay cơ bản","tips":"借 jiè là góc bên vay, 贷 dài là góc ngân hàng: EVF 借款, ngân hàng 贷款. 还 có hai âm: huán (trả) và hái (còn, vẫn).","exercises":["Nghe: nghe 5 câu, chú ý phân biệt 还 huán (trả) và 还是 háishi (hay là) trong câu 4.","Nói: mô tả một khoản vay EVF đang có: số tiền, loại tiền, kỳ hạn, cách trả gốc.","Đọc: đọc trang sản phẩm \"流动资金贷款\" trên website CCB, tìm 期限 và 用途.","Viết: viết 4 câu hỏi gửi RM về một khoản vay mới."],"review":[]},{"day":16,"title":"Hạn mức tín dụng (授信)","tips":"授 (trao) + 信 (tín) = cấp tín dụng, ghi nhớ bằng âm Hán Việt \"thụ tín\". 敞口 \"miệng mở\" = phần rủi ro để hở, không có ký quỹ hay tài sản đảm bảo.","exercises":["Nghe: nghe câu 1 nhiều lần đến khi nói theo trọn câu không nhìn chữ (câu dài nhất tuần).","Nói: giải thích bằng tiếng Trung khác biệt giữa 授信额度 và 单笔贷款 trong 2 câu.","Đọc: tìm \"综合授信协议\" trên mạng, đọc mục lục và gạch chân từ đã học.","Viết: lập bảng tóm tắt hạn mức của EVF tại 1 ngân hàng: 额度 / 品种 / 有效期 / 占用 / 余额."],"review":[]},{"day":17,"title":"Chứng chỉ tiền gửi và tiền gửi liên ngân hàng","tips":"质押 zhìyā (cầm cố giấy tờ có giá, động sản) khác 抵押 dǐyā (thế chấp bất động sản, học Ngày 19). 同业存单 là CD trên thị trường liên ngân hàng Trung Quốc, khác CD EVF phát hành tại Việt Nam.","exercises":["Nghe: nghe 5 câu, chép con số và kỳ hạn trong câu 1 và 3.","Nói: chào bán một đợt CD giả định của EVF trong 4 câu: kỳ hạn, lãi suất, số tiền tối thiểu, cách trả lãi.","Đọc: đọc trang giới thiệu 大额存单 của ICBC hoặc BOC, tìm 起存金额 và 期限.","Viết: viết thông báo chào bán CD 4 dòng (kỳ hạn, lãi suất, số tiền, hạn đăng ký)."],"review":[]},{"day":18,"title":"Trái phiếu","tips":"券 đọc quàn (không phải juàn), người bản xứ cũng hay đọc sai nên chú ý. 债 zhài = nợ; 公募/私募 = đại chúng/riêng lẻ, nhớ qua âm Hán Việt \"công mộ/tư mộ\".","exercises":["Nghe: nghe một đoạn tin ngắn về \"债券发行\" trên kênh tin tài chính, chỉ bắt tên tổ chức phát hành, kỳ hạn, lãi coupon.","Nói: mô tả một đợt trái phiếu bạn biết trong 4 câu.","Đọc: đọc tiêu đề và bảng tóm tắt của một 募集说明书 bất kỳ (tìm trên 中国债券信息网).","Viết: điền bảng: 发行人 / 币种 / 金额 / 期限 / 票息 / 承销商 cho một đợt trái phiếu giả định."],"review":[]},{"day":19,"title":"Tài sản đảm bảo và tăng cường tín dụng","tips":"应收 đọc yìngshōu (应 thanh 4), không đọc yīng. Nhớ 抵押 qua Hán Việt \"để áp\", 担保 \"đảm bảo\", 增信 \"tăng tín\".","exercises":["Nghe: nghe 5 câu, phân biệt 担保 dānbǎo và 抵押 dǐyā khi nghe nhanh.","Nói: trình bày 3 lựa chọn đảm bảo cho một khoản vay và lựa chọn EVF muốn.","Đọc: đọc mục \"担保方式\" trong một mẫu hợp đồng vay trên mạng.","Viết: viết 3 câu thuyết phục ngân hàng chấp nhận vay tín chấp."],"review":[]},{"day":20,"title":"Phí và chi phí vốn","tips":"Hầu hết loại phí = tên nghiệp vụ + 费 (承诺 + 费, 代理 + 费). Luôn hỏi 年化综合成本 để so sánh các ngân hàng trên cùng một con số.","exercises":["Nghe: nghe 5 câu, đếm số lần xuất hiện chữ 费 fèi.","Nói: liệt kê toàn bộ chi phí của một khoản vay giả định: lãi, 前端费, 承诺费, 预提税.","Đọc: đọc lại đoạn term sheet mini ở Level 3 và tính chi phí năm đầu nếu SOFR = 4%.","Viết: viết email 4 câu xin ngân hàng miễn phí trả nợ trước hạn."],"review":[]},{"day":21,"title":"Ôn tập và kiểm tra Tuần 3","tips":"","exercises":[],"review":["20 từ: 20 thẻ khó nhất của Tuần 3, ưu tiên các cặp dễ lẫn: 借/贷, 抵押/质押, 授信/信用, 票息/票面利率.","5 mẫu câu: ghép thành đoạn 2 phút hỏi điều kiện một khoản vay 50 triệu USD: kỳ hạn → cách trả gốc → đảm bảo → các loại phí → chi phí tổng hợp.","Bài tập: làm Bài kiểm tra Tuần 3 (mục 8), sau đó làm bài tập thực tế Level 3 (đọc term sheet mini).","Mẹo: vẽ sơ đồ tư duy \"贷款\" ở giữa, nối ra 期限, 利率, 担保, 费用, 还款; viết từ liên quan bằng chữ Hán quanh mỗi nhánh."]},{"day":22,"title":"Báo cáo tài chính","tips":"会计 đọc kuàijì, không đọc huìjì. 同比 = cùng kỳ năm trước, 环比 = kỳ liền trước; ngân hàng Trung Quốc hầu như luôn hỏi cả hai.","exercises":["Nghe: nghe một bản tin kết quả kinh doanh quý của một ngân hàng Big 4 (tìm \"工商银行 业绩\"), bắt 同比 và con số 净利润.","Nói: đọc 5 chỉ tiêu chính trong báo cáo tài chính gần nhất của EVF thành câu hoàn chỉnh.","Đọc: đọc phần 主要财务指标 (chỉ tiêu tài chính chính) trong báo cáo năm của CCB.","Viết: dịch 5 dòng đầu bảng cân đối của EVF sang tiếng Trung."],"review":[]},{"day":23,"title":"Chỉ số tài chính","tips":"Hậu tố 率 lǜ = tỷ lệ, 能力 nénglì = khả năng. Biết hai hậu tố này, bạn đoán được nghĩa phần lớn tên chỉ số mới.","exercises":["Nghe: nghe 5 câu, chép tên chỉ số và con số đi kèm.","Nói: trình bày 5 chỉ số thật của EVF bằng mẫu \"A + 高于/低于/保持在 + con số\".","Đọc: đọc bảng chỉ số trong báo cáo năm của ABC, tìm 不良贷款率 và 拨备覆盖率.","Viết: viết đoạn 4 câu tóm tắt sức khỏe tài chính của EVF."],"review":[]},{"day":24,"title":"Thẩm định và phê duyệt","tips":"尽调 là cách gọi tắt của 尽职调查, dùng nhiều trong hội thoại. Ngân hàng Trung Quốc sẽ đánh giá 国别风险 của Việt Nam, nên chuẩn bị sẵn vài số liệu vĩ mô bằng tiếng Trung.","exercises":["Nghe: nhờ mình đóng vai RM của ABC cập nhật tiến độ phê duyệt; bạn đọc và tóm tắt bằng tiếng Việt.","Nói: mô tả quy trình vay từ nộp hồ sơ → 尽调 → 上会 → 批复 → 放款 bằng 5 câu.","Đọc: đọc một danh mục 材料清单, đánh dấu tài liệu EVF đã có sẵn.","Viết: viết email 4 câu hỏi tiến độ phê duyệt một cách lịch sự."],"review":[]},{"day":25,"title":"Điều khoản hợp đồng","tips":"合同 đọc hétong (同 thanh nhẹ). 条 tiáo là lượng từ cho điều khoản: 第八条 = Điều 8. Ngân hàng Trung Quốc thường ghi mình là 贷款人 hoặc 甲方, kiểm tra kỹ bên nào là bên nào.","exercises":["Nghe: nghe 5 câu, chép chính tả câu 2 và 3.","Nói: giải thích 1 điều khoản EVF muốn sửa và lý do (2–3 câu).","Đọc: đọc mục lục của một mẫu 借款合同 tiếng Trung, dịch tên 10 điều khoản.","Viết: viết email 4 câu gửi lại nhận xét về dự thảo hợp đồng."],"review":[]},{"day":26,"title":"Đàm phán","tips":"Đối tác Trung Quốc thường từ chối gián tiếp: 我们研究一下 (để chúng tôi nghiên cứu), 有点儿困难 (hơi khó) thường nghĩa là chưa đồng ý. Dùng 请示领导 để có thời gian mà không mất lời.","exercises":["Nghe: nhờ mình đóng vai RM từ chối gián tiếp; bạn nhận ra câu nào là \"không\".","Nói: tập chuỗi 3 bước: đưa giá đối thủ (câu 2) → đề xuất có điều kiện (câu 3) → xin thời gian (câu 4).","Đọc: đọc to 5 mẫu câu với ngữ điệu chắc chắn, không lên giọng cuối câu khẳng định.","Viết: viết email 5 câu phản hồi báo giá và đề nghị giảm lãi suất."],"review":[]},{"day":27,"title":"Ngoại hối và thanh toán xuyên biên giới","tips":"Đứng từ góc doanh nghiệp: 结汇 = bán ngoại tệ nhận nội tệ, 购汇 = mua ngoại tệ; 售汇 là cách ngân hàng gọi việc bán ngoại tệ cho bạn. 即 jí = ngay, 远 yuǎn = xa.","exercises":["Nghe: nghe một đoạn tin về \"人民币国际化\" hoặc CIPS, bắt các từ 跨境, 结算, 汇率.","Nói: giải thích vì sao EVF cần phòng ngừa rủi ro tỷ giá khi vay USD (3 câu).","Đọc: đọc trang dịch vụ 跨境人民币 trên website BOC, tìm 3 sản phẩm.","Viết: viết hướng dẫn chuyển tiền 5 dòng: 收款人 / 开户行 / SWIFT / 币种 / 金额."],"review":[]},{"day":28,"title":"Ôn tập và kiểm tra Tuần 4","tips":"","exercises":[],"review":["20 từ: 20 thẻ khó nhất của Tuần 4, ưu tiên chỉ số tài chính và điều khoản hợp đồng.","5 mẫu câu: ghép thành đoạn 2 phút: giới thiệu báo cáo tài chính → 3 chỉ số → hỏi tiến độ phê duyệt → đề nghị giảm lãi suất → xin ý kiến lãnh đạo.","Bài tập: làm Bài kiểm tra Tuần 4 (mục 8).","Mẹo: ôn theo cặp đối nghĩa để nhớ nhanh: 资产/负债, 增长/下降, 接受/拒绝, 即期/远期, 结汇/购汇."]},{"day":29,"title":"Tiếp khách và xã giao","tips":"Khi được mời cạn ly mà không muốn uống hết, nói 我随意 (tôi xin uống tùy ý). Tránh tặng đồng hồ để bàn vì 送钟 (tặng đồng hồ) đồng âm với 送终 (lo hậu sự).","exercises":["Nghe: xem một cảnh tiệc thương mại (tìm \"商务宴请 敬酒\"), bắt các câu mời rượu.","Nói: chuẩn bị 3 câu chuyện xã giao: thời tiết Hà Nội, món Việt nên thử, lần đầu đến Việt Nam.","Đọc: đọc to 5 mẫu câu với giọng ấm, chậm hơn giọng họp.","Viết: viết tin nhắn WeChat cảm ơn sau buổi tiếp khách (3 câu)."],"review":[]},{"day":30,"title":"Tổng duyệt: mô phỏng buổi họp với ngân hàng","tips":"ghi âm toàn bộ buổi nhập vai và giữ lại. Sau 3 tháng nghe lại, bạn sẽ thấy rõ tiến bộ về thanh điệu và độ trôi chảy.","exercises":["Nói + nghe: nhập vai buổi họp 15 phút với mình (mình là 王经理 của ICBC chi nhánh Hà Nội): chào → giới thiệu EVF → nêu nhu cầu hạn mức → hỏi điều kiện → thương lượng giá → tóm tắt → xã giao.","Đọc: đọc lại term sheet mini ở Level 3, lần này không cần pinyin.","Viết: viết biên bản tóm tắt buổi họp bằng tiếng Trung (5–7 câu) và gửi mình chấm.","Kiểm tra: làm lại Bài kiểm tra đầu vào (mục 1) để so với điểm ngày đầu."],"review":["20 từ phải thuộc: 授信额度 · 贷款 · 期限 · 利率 · 基点 · 担保 · 前端费 · 承诺费 · 放款 · 还款 · 存单 · 债券 · 承销商 · 审批 · 尽调 · 协议 · 条款 · 违约 · 汇率风险 · 长期合作"]}],"levels":[{"level":1,"title":"Nền tảng (tương đương HSK 1, tháng 1)","goals":["Đọc đúng toàn bộ bảng pinyin, 4 thanh, thanh nhẹ và biến điệu của 不, 一 và hai thanh 3 liền nhau.","Tự giới thiệu bản thân và công ty trong 30 giây.","Đọc và nghe đúng số tiền theo hệ 万 (10⁴) và 亿 (10⁸), không cần nhẩm sang hệ nghìn.","Nhận biết khoảng 150 chữ thường gặp."],"exercise":"Bài tập thực tế – Đọc số tiền trên term sheet\nĐọc to và ghi âm 4 con số sau, rồi so với đáp án: (1) 50.000.000 USD; (2) 1,2 tỷ CNY; (3) 500 tỷ VND; (4) 300.000 CNY. Sau đó viết 3 câu tự giới thiệu: tên, quốc tịch, nơi làm việc.\nĐáp án: (1) 五千万美元 wǔqiān wàn měiyuán · (2) 十二亿元人民币 shí'èr yì yuán rénmínbì · (3) 五千亿越南盾 wǔqiān yì Yuènán dùn · (4) 三十万元 sānshí wàn yuán. Mẹo: đếm 4 chữ số từ phải sang là 万, 8 chữ số là 亿."},{"level":2,"title":"Giao tiếp công việc (tương đương HSK 2, tháng 2–3)","goals":["Hẹn lịch họp, trao danh thiếp, giới thiệu phòng ban và vai trò của mình.","Hỏi được 3 thông tin cơ bản của một sản phẩm: lãi suất, kỳ hạn, phí.","Viết email ngắn 5 câu xác nhận lịch họp và gửi tài liệu.","Vốn khoảng 300 từ, nhận biết khoảng 300 chữ."],"exercise":"Bài tập thực tế – Email hẹn họp\nViết email 5 câu gửi chị Wang, giám đốc khách hàng doanh nghiệp của một chi nhánh ICBC tại Hà Nội: chào, giới thiệu bản thân và EVF, đề nghị gặp vào thứ Ba tuần sau, nói rõ muốn trao đổi về lãi suất và kỳ hạn khoản vay, cảm ơn. Dùng ít nhất 8 từ trong bảng trên.\nMẫu mở đầu: 王经理，您好！我是EVF公司的阳。Wáng jīnglǐ, nín hǎo! Wǒ shì EVF gōngsī de Yáng."},{"level":3,"title":"Nghiệp vụ huy động vốn (tương đương HSK 3, tháng 4–6)","goals":["Đọc hiểu term sheet tiếng Trung của khoản vay song phương, CD và trái phiếu: số tiền, kỳ hạn, lãi suất, tài sản đảm bảo, phí.","Trao đổi 10 phút về điều kiện hạn mức tín dụng với cán bộ quan hệ khách hàng.","Đặt câu hỏi làm rõ khi không hiểu một điều khoản.","Vốn khoảng 600 từ chung và 200 thuật ngữ chuyên ngành."],"exercise":"Bài tập thực tế – Đọc term sheet mini\nĐọc đoạn dưới, tóm tắt bằng tiếng Việt trong 5 gạch đầu dòng, rồi viết 3 câu hỏi làm rõ bằng tiếng Trung (ví dụ hỏi về phí cam kết và điều kiện giải ngân).\n借款人：EVF。授信额度：五千万美元。期限：三年。利率：浮动利率，SOFR加点一百八十个基点。前端费：百分之零点五。担保：信用，无抵押。\n(借款人 jièkuǎnrén = bên vay; 基点 jīdiǎn = điểm cơ bản, bp.)"},{"level":4,"title":"Phân tích tài chính và đàm phán (tương đương HSK 4, tháng 7–12)","goals":["Thuyết trình 3 phút về tình hình tài chính và nhu cầu vốn của công ty.","Trả lời câu hỏi phản biện về đòn bẩy, dòng tiền, khả năng trả nợ.","Thương lượng giá vốn: đưa ra mức giá, đề nghị nhượng bộ, giữ điểm sàn.","Vốn khoảng 1.200 từ, đọc được báo cáo phân tích ngắn."],"exercise":"Bài tập thực tế – Thuyết trình 3 phút\nChuẩn bị bài nói 3 phút theo khung: doanh thu và lợi nhuận ròng năm gần nhất → tỷ lệ nợ và hệ số thanh toán → nhu cầu vốn (số tiền, loại tiền, kỳ hạn) → phương án trả nợ. Sau đó nhờ mình đóng vai cán bộ thẩm định CCB hỏi 3 câu phản biện."},{"level":5,"title":"Chuyên gia (tương đương HSK 5 + tiếng Trung thương mại, năm thứ 2)","goals":["Đọc hiểu hợp đồng vay, MOU và thông cáo của Ngân hàng Nhân dân Trung Quốc (中国人民银行).","Chủ trì một buổi đàm phán 30 phút bằng tiếng Trung, kể cả phần xã giao với lãnh đạo.","Trao đổi về tài trợ xuyên biên giới bằng CNY, trái phiếu xanh, khoản vay hợp vốn.","Vốn khoảng 2.500 từ."],"exercise":"Bài tập thực tế – Đề xuất hợp tác chiến lược\nViết email khoảng 200 chữ gửi lãnh đạo một chi nhánh BOC, đề xuất ký MOU hợp tác gồm 3 nội dung: hạn mức tín dụng, thanh toán CNY xuyên biên giới và phát hành CD. Sau đó đóng vai đàm phán 15 phút với mình về điều khoản luật áp dụng và trọng tài."}],"dialogues":[{"title":"Gặp RM của ICBC lần đầu","level":2,"keywords":[{"hz":"业务","py":"yè-WÙ","vi":"\"nghiệp vụ\", dùng cho mọi mảng giao dịch: 贷款业务, 同业业务"},{"hz":"了解","py":"liǎo-JIĚ","vi":"\"tìm hiểu\", lịch sự hơn 问 khi hỏi về chính sách của đối tác"},{"hz":"政策","py":"zhèng-CÈ","vi":"chính sách; 授信政策 = chính sách cấp tín dụng"},{"hz":"初步","py":"chū-BÙ","vi":"\"bước đầu\", đặt trước con số chưa chốt để không bị ràng buộc"},{"hz":"尽快","py":"jǐn-KUÀI","vi":"\"sớm nhất có thể\", câu hứa tiêu chuẩn trong email"}],"lines":[{"sp":"王","hz":"您好，欢迎来工行。我是公司业务部的王经理。","py":"Nín hǎo, huānyíng lái Gōngháng. Wǒ shì gōngsī yèwù bù de Wáng jīnglǐ.","vi":"Chào anh, chào mừng đến ICBC. Tôi là Vương, trưởng phòng khách hàng doanh nghiệp."},{"sp":"阳","hz":"王经理您好，我是EVF金融机构部的阳，这是我的名片。","py":"Wáng jīnglǐ nín hǎo, wǒ shì EVF jīnróng jīgòu bù de Yáng, zhè shì wǒ de míngpiàn.","vi":"Chào chị Vương, tôi là Dương, Ban Định chế tài chính EVF, đây là danh thiếp của tôi."},{"sp":"王","hz":"谢谢。请问今天想谈什么业务？","py":"Xièxie. Qǐngwèn jīntiān xiǎng tán shénme yèwù?","vi":"Cảm ơn. Hôm nay anh muốn trao đổi về nghiệp vụ nào?"},{"sp":"阳","hz":"我们想了解一下贵行的同业授信政策。","py":"Wǒmen xiǎng liǎojiě yíxià guì háng de tóngyè shòuxìn zhèngcè.","vi":"Chúng tôi muốn tìm hiểu chính sách cấp tín dụng liên ngân hàng của quý ngân hàng."},{"sp":"王","hz":"没问题。贵公司大概需要多少额度？","py":"Méi wèntí. Guì gōngsī dàgài xūyào duōshao édù?","vi":"Được. Qu  thành; 了 cuối câu báo tình hình mới. Phủ định quá khứ dùng 没(有), bỏ 了.","examples":[{"hz":"资料我已经发了。","py":"Zīliào wǒ yǐjīng fā le.","vi":"Tài liệu tôi gửi rồi."},{"hz":"审批通过了。","py":"Shěnpī tōngguò le.","vi":"Đã được phê duyệt."},{"hz":"我们还没收到批复。","py":"Wǒmen hái méi shōudào pīfù.","vi":"Chúng tôi vẫn chưa nhận được văn bản phê duyệt."}],"ex":[{"type":"order","tokens":["利率","下调","了"],"vi":"Lãi suất đã giảm."},{"type":"choice","q":"Phủ định của \"我收到了邮件\" là:","options":["我没收到邮件。","我不收到了邮件。","我没收到了邮件。"],"answer":0}]},{"title":"过: đã từng","level":2,"pattern":"Động từ + 过","explain":"过 báo việc đã từng xảy ra (kinh nghiệm), hay dùng khi nhắc lại hồ sơ đã nộp, cuộc gặp trước.","examples":[{"hz":"我们之前提交过申请。","py":"Wǒmen zhīqián tíjiāo guo shēnqǐng.","vi":"Trước đây chúng tôi đã từng nộp hồ sơ."},{"hz":"您来过越南吗？","py":"Nín láiguo Yuènán ma?","vi":"Anh/chị đã từng đến Việt Nam chưa?"},{"hz":"我们和建行合作过。","py":"Wǒmen hé Jiànháng hézuò guo.","vi":"Chúng tôi từng hợp tác với CCB."}],"ex":[{"type":"order","tokens":["您","去过","河内","吗"],"vi":"Anh/chị đã từng đến Hà Nội chưa?"}]},{"title":"还是 (hỏi lựa chọn) và 或者 (câu trần thuật)","level":2,"pattern":"A 还是 B？ / A 或者 B","explain":"还是 dùng trong câu hỏi \"A hay B?\"; 或者 dùng trong câu trần thuật \"A hoặc B\".","examples":[{"hz":"是固定利率还是浮动利率？","py":"Shì gùdìng lìlǜ háishi fúdòng lìlǜ?","vi":"Lãi suất cố định hay thả nổi?"},{"hz":"存单可以质押或者转让。","py":"Cúndān kěyǐ zhìyā huòzhě zhuǎnràng.","vi":"CD có thể cầm cố hoặc chuyển nhượng."},{"hz":"您喝茶还是咖啡？","py":"Nín hē chá háishi kāfēi?","vi":"Anh/chị uống trà hay cà phê?"}],"ex":[{"type":"choice","q":"本金分期还___到期一次性还？","options":["还是","或者","和"],"answer":0},{"type":"choice","q":"我们可以用美元___人民币付款。","options":["或者","还是","吗"],"answer":0}]},{"title":"比: so sánh","level":2,"pattern":"A + 比 + B + tính từ (+ mức chênh)","explain":"Mức chênh đặt sau tính từ: 低二十个基点, 高一点. Không dùng 很 trong câu có 比.","examples":[{"hz":"这个报价比市场水平高一点。","py":"Zhège bàojià bǐ shìchǎng shuǐpíng gāo yìdiǎn.","vi":"Báo giá này cao hơn mặt bằng thị trường một chút."},{"hz":"工行的利率比建行低二十个基点。","py":"Gōngháng de lìlǜ bǐ Jiànháng dī èrshí ge jīdiǎn.","vi":"Lãi suất ICBC thấp hơn CCB 20bp."},{"hz":"今年的收入比去年多。","py":"Jīnnián de shōurù bǐ qùnián duō.","vi":"Thu nhập năm nay nhiều hơn năm ngoái."}],"ex":[{"type":"order","tokens":["人民币","利率","比","美元","低"],"vi":"Lãi suất CNY thấp hơn USD."},{"type":"choice","q":"Câu đúng là:","options":["A行比B行便宜一点。","A行比B行很便宜。","A行很比B行便宜。"],"answer":0}]},{"title":"把: xử lý một đối tượng cụ thể","level":3,"pattern":"Chủ ngữ + 把 + tân ngữ + động từ + kết quả/hướng","explain":"把 đưa tân ngữ lên trước động từ, nhấn mạnh việc xử lý nó. Hay dùng khi giao việc: gửi, chuyển, sửa tài liệu.","examples":[{"hz":"请把对账单发给我们。","py":"Qǐng bǎ duìzhàngdān fā gěi wǒmen.","vi":"Vui lòng gửi sao kê cho chúng tôi."},{"hz":"我把资料发到您的邮箱了。","py":"Wǒ bǎ zīliào fā dào nín de yóuxiāng le.","vi":"Tôi đã gửi tài liệu vào email của anh/chị."},{"hz":"请把第八条改一下。","py":"Qǐng bǎ dì bā tiáo gǎi yíxià.","vi":"Vui lòng sửa Điều 8 một chút."}],"ex":[{"type":"order","tokens":["请","把","合同","发给","我"],"vi":"Vui lòng gửi hợp đồng cho tôi."}]},{"title":"如果…就…: điều kiện","level":3,"pattern":"如果 + điều kiện，(chủ ngữ) + 就 + kết quả","explain":"Mẫu câu chính khi đàm phán có điều kiện. 就 đứng sau chủ ngữ của vế sau.","examples":[{"hz":"如果利率能降低，我们就接受。","py":"Rúguǒ lìlǜ néng jiàngdī, wǒmen jiù jiēshòu.","vi":"Nếu lãi suất giảm được, chúng tôi sẽ chấp nhận."},{"hz":"如果有问题，请随时联系我。","py":"Rúguǒ yǒu wèntí, qǐng suíshí liánxì wǒ.","vi":"Nếu có vấn đề, xin liên hệ tôi bất cứ lúc nào."},{"hz":"如果审批通过，下个月就可以放款。","py":"Rúguǒ shěnpī tōngguò, xià ge yuè jiù kěyǐ fàngkuǎn.","vi":"Nếu được duyệt, tháng sau có thể giải ngân."}],"ex":[{"type":"choice","q":"如果贵行免除前端费，我们___签约。","options":["就","才","也"],"answer":0}]},{"title":"因为…所以…: nguyên nhân – kết quả","level":3,"pattern":"因为 + nguyên nhân，所以 + kết quả","explain":"Dùng khi giải thích lý do một đề xuất. Có thể bỏ một trong hai từ khi nói nhanh.","examples":[{"hz":"因为汇率风险大，所以我们想用人民币结算。","py":"Yīnwèi huìlǜ fēngxiǎn dà, suǒyǐ wǒmen xiǎng yòng rénmínbì jiésuàn.","vi":"Vì rủi ro tỷ giá lớn nên chúng tôi muốn thanh toán bằng CNY."},{"hz":"因为年底需要资金，所以我们希望尽快放款。","py":"Yīnwèi niándǐ xūyào zījīn, suǒyǐ wǒmen xīwàng jǐnkuài fàngkuǎn.","vi":"Vì cuối năm cần vốn nên chúng tôi mong giải ngân sớm."}],"ex":[{"type":"order","tokens":["因为","评级","很高","所以","利率","比较低"],"vi":"Vì xếp hạng cao nên lãi suất khá thấp."}]},{"title":"一下 và lặp động từ: làm câu mềm, lịch sự","level":2,"pattern":"Động từ + 一下 / Động từ lặp (谈谈, 看看)","explain":"Làm hành động nghe nhẹ và lịch sự hơn. Rất phổ biến khi đề nghị đối tác.","examples":[{"hz":"我们想了解一下贵行的政策。","py":"Wǒmen xiǎng liǎojiě yíxià guì háng de zhèngcè.","vi":"Chúng tôi muốn tìm hiểu chính sách của quý ngân hàng."},{"hz":"我们谈谈合作吧。","py":"Wǒmen tántan hézuò ba.","vi":"Chúng ta bàn về hợp tác nhé."},{"hz":"请您看一下附件。","py":"Qǐng nín kàn yíxià fùjiàn.","vi":"Mời anh/chị xem tệp đính kèm."}],"ex":[{"type":"order","tokens":["我","先","介绍","一下","我们公司"],"vi":"Tôi xin giới thiệu sơ qua về công ty chúng tôi."}]},{"title":"能 / 可以 / 会","level":2,"pattern":"能/可以 + động từ (có khả năng, được phép); 会 + động từ (sẽ, biết)","explain":"能 và 可以 thường thay nhau khi xin phép hoặc hỏi khả năng; 会 dùng để hứa \"sẽ\" làm.","examples":[{"hz":"能不能再优惠十个基点？","py":"Néng bu néng zài yōuhuì shí ge jīdiǎn?","vi":"Có thể ưu đãi thêm 10bp không?"},{"hz":"额度可以循环使用。","py":"Édù kěyǐ xúnhuán shǐyòng.","vi":"Hạn mức có thể dùng quay vòng."},{"hz":"我们会尽快发给您。","py":"Wǒmen huì jǐnkuài fā gěi nín.","vi":"Chúng tôi sẽ gửi anh/chị sớm nhất."}],"ex":[{"type":"choice","q":"我们___在周五前提交材料。","options":["会","是","很"],"answer":0}]},{"title":"Câu hỏi chính phản: V 不 V / 有没有","level":2,"pattern":"Động từ + 不/没 + động từ？","explain":"Cách hỏi tự nhiên thay cho 吗, không thêm 吗 ở cuối.","examples":[{"hz":"有没有宽限期？","py":"Yǒu méiyǒu kuānxiànqī?","vi":"Có thời gian ân hạn không?"},{"hz":"是不是固定利率？","py":"Shì bu shì gùdìng lìlǜ?","vi":"Có phải lãi suất cố định không?"},{"hz":"您明天方便不方便？","py":"Nín míngtiān fāngbiàn bu fāngbiàn?","vi":"Ngày mai anh/chị có tiện không?"}],"ex":[{"type":"choice","q":"Câu nào SAI?","options":["有没有手续费吗？","有没有手续费？","有手续费吗？"],"answer":0}]},{"title":"由: ai chịu trách nhiệm / ai thực hiện","level":3,"pattern":"Việc + 由 + người/bên + động từ","explain":"Hay gặp trong hợp đồng và term sheet để chỉ bên chịu phí, bên thực hiện.","examples":[{"hz":"预提税由哪一方承担？","py":"Yùtíshuì yóu nǎ yì fāng chéngdān?","vi":"Thuế khấu trừ tại nguồn do bên nào chịu?"},{"hz":"这件事由财务部负责。","py":"Zhè jiàn shì yóu cáiwù bù fùzé.","vi":"Việc này do phòng tài chính phụ trách."},{"hz":"审计报告由会计师事务所出具。","py":"Shěnjì bàogào yóu kuàijìshī shìwùsuǒ chūjù.","vi":"Báo cáo kiểm toán do công ty kiểm toán phát hành."}],"ex":[{"type":"order","tokens":["律师费","由","借款人","承担"],"vi":"Phí luật sư do bên vay chịu."}]},{"title":"关于 / …方面 / 对…来说: chuyển và giới hạn chủ đề","level":3,"pattern":"关于 + chủ đề，… / X 方面，… / 对 + ai + 来说，…","explain":"Giúp chia nội dung trong cuộc họp và nêu quan điểm của một bên.","examples":[{"hz":"关于利率，我们希望再讨论一下。","py":"Guānyú lìlǜ, wǒmen xīwàng zài tǎolùn yíxià.","vi":"Về lãi suất, chúng tôi mong được thảo luận thêm."},{"hz":"额度方面，我们已经提交了申请。","py":"Édù fāngmiàn, wǒmen yǐjīng tíjiāo le shēnqǐng.","vi":"Về hạn mức, chúng tôi đã nộp hồ sơ."},{"hz":"对我们公司来说，期限比利率更重要。","py":"Duì wǒmen gōngsī lái shuō, qīxiàn bǐ lìlǜ gèng zhòngyào.","vi":"Với công ty chúng tôi, kỳ hạn quan trọng hơn lãi suất."}],"ex":[{"type":"choice","q":"___费用，还有哪些需要确认？","options":["关于","因为","如果"],"answer":0}]}],"meta":{"title":"Tiếng Trung Tài chính – Ngân hàng","version":"2026-11-21","source":"Lộ trình tiếng Trung Tài chính – Ngân hàng (Level 0–5)"}}</script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js" onerror="window.HW_FAIL=true"></script>
<script>
(function(){
'use strict';
/* ====== Khởi tạo & lưu trữ ====== */
var SHELL = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
var DATA_TEXT = document.getElementById('app-data').textContent;
var DATA0 = JSON.parse(DATA_TEXT);
var SIG = (DATA0.meta && DATA0.meta.version || '') + ':' + DATA_TEXT.length;
var MEM = {};
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem('zf_'+k); return v ? JSON.parse(v) : (k in MEM ? MEM[k] : d); }catch(e){ return k in MEM ? MEM[k] : d; } },
  set: function(k, v){ MEM[k] = v; try{ localStorage.setItem('zf_'+k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ delete MEM[k]; try{ localStorage.removeItem('zf_'+k); }catch(e){} }
};
var DATA = DATA0, CUSTOM = false;
var saved = store.get('data', null);
if (saved && saved.sig === SIG && saved.data) { DATA = saved.data; CUSTOM = true; }
normalize(DATA);
var S = store.get('settings', {rate: 0.85, py: true});
var SRS = store.get('srs', {});
var PROG = store.get('prog', {days: {}, quiz: {right: 0, total: 0}, write: 0, streak: {last: '', n: 0}});

function normalize(d){
  ['vocab','sentences','days','levels','dialogues','readings','tests','grammar','pron'].forEach(function(k){ if(!Array.isArray(d[k])) d[k] = []; });
  if (!d.pinyin) d.pinyin = {tones:[],initials:[],finals:[],sandhi:[],pairs:[]};
  if (!d.meta) d.meta = {};
  d.vocab.forEach(function(v){ v.hz = String(v.hz||'').trim(); v.py = String(v.py||'').trim(); v.vi = String(v.vi||'').trim(); v.level = +v.level || 1; v.day = v.day ? +v.day : null; v.topic = v.topic || ''; });
  d.vocab = d.vocab.filter(function(v){ return v.hz; });
  d.days.sort(function(a,b){ return a.day - b.day; });
  d.levels.sort(function(a,b){ return a.level - b.level; });
}
function saveData(){ store.set('data', {sig: SIG, data: DATA}); CUSTOM = true; buildIndex(); }
var VSET, VMAP;
function buildIndex(){ VSET = new Set(); VMAP = {}; DATA.vocab.forEach(function(v){ VSET.add(v.hz); VMAP[v.hz] = v; }); }
buildIndex();

/* ====== Tiện ích ====== */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function today(){ var d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2200); }
function isHan(c){ return /[\u3400-\u9fff]/.test(c); }
function hanChars(s){ return Array.from(String(s)).filter(isHan); }
function copyText(t){
  function fb(){ var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); toast('Đã sao chép'); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast('Đã sao chép'); }, fb); else fb();
}
function download(name, text, type){ var b = new Blob([text], {type: type || 'text/plain'}); var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function saveProg(){ store.set('prog', PROG); }
function touchStreak(){ var t = today(); if (PROG.streak.last === t) return; var y = new Date(Date.now()-864e5); var ys = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); PROG.streak.n = PROG.streak.last === ys ? PROG.streak.n + 1 : 1; PROG.streak.last = t; saveProg(); }

/* ====== Pinyin: thanh điệu ====== */
var MARKS = {a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
var TM = {};
Object.keys(MARKS).forEach(function(b){ Array.from(MARKS[b]).forEach(function(c, i){ TM[c] = [b, i+1]; TM[c.toUpperCase()] = [b.toUpperCase(), i+1]; }); });
var MARK_RE = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛ]/g;
function analyze(s){
  s = String(s).normalize('NFC').toLowerCase().replace(/v/g, 'ü').replace(/u:/g, 'ü');
  var tones = [];
  if (/[1-5]/.test(s)) { (s.match(/[1-5]/g) || []).forEach(function(d){ if (d !== '5') tones.push(+d); }); }
  s = s.replace(MARK_RE, function(c){ var m = TM[c] || TM[c.toLowerCase()]; tones.push(m[1]); return m[0].toLowerCase(); });
  return {letters: s.replace(/[^a-zü]/g, ''), tones: tones};
}
var SYL = /(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(iang|iong|uang|ang|eng|ing|ong|ian|iao|uai|uan|üan|ai|ei|ao|ou|an|en|er|ia|ie|in|iu|ua|uo|ui|un|üe|ue|ün|a|o|e|i|u|ü)(?![aeiouü])/y;
function toNumbered(py){
  var src = String(py).normalize('NFC'), chars = Array.from(src), plain = '', tone = [];
  chars.forEach(function(c){ var m = TM[c]; if (m){ plain += m[0].toLowerCase(); tone.push(m[1]); } else { plain += c.toLowerCase(); tone.push(0); } });
  var out = '', i = 0;
  while (i < plain.length){
    SYL.lastIndex = i; var m = SYL.exec(plain);
    if (m && /[a-zü]/.test(plain[i])){ var t = 0; for (var k = i; k < i + m[0].length; k++) if (tone[k]) t = tone[k]; out += m[0] + (t || ''); i += m[0].length; if (i < plain.length && /[a-zü]/.test(plain[i])) out += ' '; }
    else { out += chars[i]; i++; }
  }
  return out.replace(/\s+/g, ' ').trim();
}
function retone(py, tones){ var k = 0; return String(py).replace(MARK_RE, function(c){ var m = TM[c]; var b = m[0].toLowerCase(); var r = MARKS[b][(tones[k++]||m[1]) - 1]; return m[0] === m[0].toUpperCase() && m[0] !== b ? r.toUpperCase() : r; }); }
function toneSeq(py){ return analyze(py).tones; }

/* ====== Giọng đọc ====== */
var VOICES = [];
function loadVoices(){ if (!('speechSynthesis' in window)) return; VOICES = speechSynthesis.getVoices().filter(function(v){ return /^(zh|cmn)/i.test(v.lang); }); var w = document.getElementById('vwarn'); if (w && VOICES.length) w.remove(); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voice(){ if (!VOICES.length) return null; var pref = VOICES.filter(function(v){ return /zh[-_]CN/i.test(v.lang); }); var list = pref.length ? pref : VOICES; var named = list.filter(function(v){ return S.voice && v.name === S.voice; }); return named[0] || list[0]; }
function speak(text, opt){
  opt = opt || {};
  if (!('speechSynthesis' in window)) { toast('Trình duyệt không hỗ trợ đọc. Hãy dùng Chrome hoặc Edge.'); if (opt.onend) opt.onend(); return; }
  var t = String(text).replace(/[\/／]/g, '，').replace(/…|\.\.\./g, '');
  speechSynthesis.cancel();
  setTimeout(function(){
    var u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; var v = voice(); if (v) u.voice = v;
    u.rate = opt.rate || S.rate; u.pitch = opt.pitch || 1;
    var done = false; function end(){ if (done) return; done = true; if (opt.onend) opt.onend(); }
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  }, 60);
}
function stopSpeak(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function spk(text, cls){ return '<button class="btn ic '+(cls||'')+'" data-say="'+esc(text)+'" title="Nghe">🔊</button>'; }
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-say]'); if (b){ e.stopPropagation(); speak(b.getAttribute('data-say'), {rate: b.hasAttribute('data-slow') ? 0.55 : null}); return; }
  var w = e.target.closest('[data-word]'); if (w){ openWord(w.getAttribute('data-word')); }
});

/* ====== HanziWriter ====== */
function hwReady(){ return !!window.HanziWriter; }
function hwMsg(){ return '<div class="notice">Không tải được thư viện nét chữ (HanziWriter). Phần xem nét và luyện viết cần kết nối Internet.</div>'; }
function strokeBoxes(el, word, size){
  size = size || 130;
  var chars = hanChars(word);
  if (!hwReady()){ el.innerHTML = hwMsg(); return; }

/* ====== Lặp lại ngắt quãng (SRS) ====== */
function card(hz){ return SRS[hz] || {r: 0, i: 0, e: 2.5, due: 0, l: 0}; }
function rateCard(hz, q){
  var c = card(hz), now = Date.now();
  if (q === 0){ c.l++; c.i = 0; c.e = Math.max(1.3, c.e - 0.2); c.due = now + 6e4; }
  else {
    if (q === 1){ c.i = Math.max(1, c.i * 1.2); c.e = Math.max(1.3, c.e - 0.15); }
    else if (q === 2){ c.i = c.i ? c.i * c.e : 1; }
    else { c.i = (c.i ? c.i * c.e : 1) * 1.3 + 1; c.e += 0.15; }
    c.r++; c.due = now + c.i * 864e5;
  }
  SRS[hz] = c; store.set('srs', SRS); touchStreak();
}
function learnedCount(){ return Object.keys(SRS).filter(function(k){ return SRS[k].r > 0 && VMAP[k]; }).length; }
function dueList(){ var now = Date.now(); return DATA.vocab.filter(function(v){ var c = SRS[v.hz]; return c && c.r > 0 && c.due <= now; }); }

var QTYPES = [['mix','Trộn tất cả'],['hz2vi','Chữ Hán → nghĩa'],['vi2hz','Nghĩa → chữ Hán'],['py2hz','Pinyin → chữ Hán'],['audio','Nghe → chọn chữ'],['tone','Chọn thanh điệu đúng'],['cloze','Điền từ vào câu']];
function distract(w, pool, key, n){
  var same = pool.filter(function(x){ return x.hz !== w.hz && x[key] !== w[key] && x.level === w.level; });
  if (same.length < n) same = pool.filter(function(x){ return x.hz !== w.hz && x[key] !== w[key]; });
  var out = [], seen = {}; seen[w[key]] = 1;
  shuffle(same).forEach(function(x){ if (out.length < n && !seen[x[key]]){ seen[x[key]] = 1; out.push(x); } });
  return out;
}
function makeQ(type, w, pool){
  if (type === 'mix'){ type = pick(['hz2vi','vi2hz','py2hz','audio','tone','hz2vi']); }
  if (type === 'tone'){
    var t = toneSeq(w.py); if (!t.length) type = 'hz2vi';
    else {
      var variants = {}; variants[w.py] = 1; var opts = [w.py], guard = 0;
      while (opts.length < 4 && guard++ < 60){ var r = retone(w.py, t.map(function(){ return 1 + Math.floor(Math.random()*4); })); if (!variants[r]){ variants[r] = 1; opts.push(r); } }
      if (opts.length < 2) type = 'hz2vi';
      else return {type: 'tone', w: w, prompt: '<div class="prompt-hz">'+esc(w.hz)+'</div><p style="text-align:center" class="vi">Chọn pinyin có thanh điệu đúng · '+esc(w.vi)+'</p>', opts: shuffle(opts).map(function(o){ return {label: esc(o), ok: o === w.py}; }), say: w.hz};
    }
  }
  if (type === 'cloze'){
    var cands = DATA.sentences.concat(DATA.dialogues.reduce(function(a, d){ return a.concat(d.lines); }, [])).filter(function(s){ return s.hz.indexOf(w.hz) >= 0 && w.hz.length >= 2; });
    if (cands.length){
      var s = pick(cands), ds = distract(w, pool, 'hz', 3);
      return {type: 'cloze', w: w, prompt: '<p class="zh" style="font-size:22px;text-align:center">'+esc(s.hz).split(esc(w.hz)).join('<u>　＿＿　</u>')+'</p><p class="vi" style="text-align:center">'+esc(s.vi)+'</p>', opts: shuffle([w].concat(ds)).map(function(x){ return {label: '<span class="zh" style="font-size:20px">'+esc(x.hz)+'</span>', ok: x.hz === w.hz}; }), say: s.hz};
    }
    type = 'vi2hz';
  }
  var key = (type === 'hz2vi') ? 'vi' : 'hz';
  var ds2 = distract(w, pool, key, 3), all = shuffle([w].concat(ds2));
  var prompt = type === 'hz2vi' ? '<div class="prompt-hz">'+esc(w.hz)+'</div>'+(S.py?'<p class="py" style="text-align:center;font-size:18px">'+esc(w.py)+'</p>':'') :
               type === 'vi2hz' ? '<p style="text-align:center;font-size:22px">'+esc(w.vi)+'</p>' :

               '<div style="text-align:center"><button class="btn pri" data-say="'+esc(w.hz)+'" style="font-size:20px;padding:12px 22px">🔊 Nghe</button></div>';
  return {type: type, w: w, prompt: prompt, opts: all.map(function(x){ return {label: key === 'vi' ? esc(x.vi) : '<span class="zh" style="font-size:20px">'+esc(x.hz)+'</span>'+(type==='vi2hz'&&S.py?' <span class="py">'+esc(x.py)+'</span>':''), ok: x.hz === w.hz}; }), say: w.hz, auto: type === 'audio'};
}

function segment(s){
  var t = [], i = 0, a = Array.from(s);
  while (i < a.length){
    var c = a[i];
    if (isHan(c)){ var f = null; for (var L = Math.min(6, a.length - i); L > 1; L--){ var w = a.slice(i, i+L).join(''); if (VSET.has(w)){ f = w; break; } } f = f || c; t.push(f); i += Array.from(f).length; }
    else if (/[A-Za-z0-9]/.test(c)){ var m = a.slice(i).join('').match(/^[A-Za-z0-9.%]+/)[0]; t.push(m); i += m.length; }
    else i++;
  }
  var out = [];
  t.forEach(function(x){ var last = out[out.length-1]; if (last && Array.from(x).length === 1 && Array.from(last).length === 1 && isHan(x) && isHan(last) && out.length > 0 && t.length > 8) out[out.length-1] = last + x; else out.push(x); });
  return out;
}
function stripP(s){ return Array.from(s).filter(function(c){ return isHan(c) || /[A-Za-z0-9.%]/.test(c); }).join(''); }
function orderWidget(el, tokens, answerText, vi, onDone){
  var picked = [], sh = shuffle(tokens.map(function(t, k){ return {t: t, k: k}; }));
  if (tokens.length > 1 && sh.map(function(x){ return x.t; }).join('') === tokens.join('')) sh.reverse();
  function draw(fb){
    el.innerHTML = (vi?'<p class="vi">'+esc(vi)+'</p>':'')+'<div class="ans-area zh">'+picked.map(function(x, j){ return '<span class="tok" data-u="'+j+'">'+esc(x.t)+'</span>'; }).join('')+'</div><div style="margin:8px 0">'+
      sh.map(function(x, j){ return '<span class="tok'+(picked.indexOf(x) >= 0 ? ' used' : '')+'" data-s="'+j+'">'+esc(x.t)+'</span>'; }).join('')+'</div><div class="row"><button class="btn pri" data-c>Kiểm tra</button><button class="btn" data-r>Làm lại</button>'+spk(answerText)+'</div>'+(fb||'');
    $$('[data-s]', el).forEach(function(b){ b.onclick = function(){ picked.push(sh[+b.getAttribute('data-s')]); draw(); }; });
    $$('[data-u]', el).forEach(function(b){ b.onclick = function(){ picked.splice(+b.getAttribute('data-u'), 1); draw(); }; });
    $('[data-r]', el).onclick = function(){ picked = []; draw(); };
    $('[data-c]', el).onclick = function(){ var ok = stripP(picked.map(function(x){ return x.t; }).join('')) === stripP(answerText);
      draw('<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Chính xác! ':'Chưa đúng. Đáp án: ')+'<span class="zh">'+esc(answerText)+'</span></div>'); if (ok) speak(answerText); if (onDone) onDone(ok); };
  }
  draw();
}

var SCHEMA = '{\n  "vocab": [ {"hz":"授信","py":"shòuxìn","vi":"cấp tín dụng","level":3,"day":16,"topic":"Hạn mức"} ],\n  "sentences": [ {"hz":"…","py":"…","vi":"…","day":16} ],\n  "days": [ {"day":31,"title":"…","exercises":["…"],"tips":"…","review":[]} ],\n  "levels": [ {"level":3,"title":"…","goals":["…"],"exercise":"Tiêu đề\\nĐề bài…"} ],\n  "dialogues": [ {"title":"…","level":2,"keywords":[{"hz":"…","py":"…","vi":"…"}],"lines":[{"sp":"王","hz":"…","py":"…","vi":"…"}],"note":"…"} ],\n  "grammar": [ {"title":"…","level":2,"pattern":"…","explain":"…","examples":[{"hz":"…","py":"…","vi":"…"}],"ex":[{"type":"choice","q":"…___…","options":["A","B","C"],"answer":0},{"type":"order","tokens":["我","在","河内","工作"],"vi":"…"}]} ],\n  "readings": [ {"title":"…","level":"Level 2","hz":"…","py":"…","note":"…","task":"…"} ],\n  "tests": [ {"week":5,"mcq":[{"q":"…","options":["…","…","…","…"],"answer":1}],"essay":["…"]} ]\n}';
function parseCSV(text){
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++){ var c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',' || c === '\t' || c === ';'){ row.push(f); f = ''; } else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  var h = rows.shift().map(function(x){ return x.trim().toLowerCase(); });
  var map = {hz: ['hz','chữ hán','chu han','hanzi','từ','tu'], py: ['py','pinyin'], vi: ['vi','nghĩa','nghia','meaning'], level: ['level','cấp'], day: ['day','ngày','ngay'], topic: ['topic','chủ đề','chu de']};
  var idx = {}; Object.keys(map).forEach(function(k){ idx[k] = h.findIndex(function(x){ return map[k].indexOf(x) >= 0; }); });
  if (idx.hz < 0) idx = {hz: 0, py: 1, vi: 2, level: 3, day: 4, topic: 5};
  return {vocab: rows.filter(function(r){ return r[idx.hz]; }).map(function(r){ return {hz: r[idx.hz], py: r[idx.py] || '', vi: r[idx.vi] || '', level: +(r[idx.level]) || 1, day: +(r[idx.day]) || null, topic: r[idx.topic] || ''}; })};
}
function mergeData(inc, replace){
  var rep = {added: 0, updated: 0};
  if (replace){ ['vocab','sentences','days','levels','dialogues','readings','tests','grammar','pron'].forEach(function(k){ if (Array.isArray(inc[k])) DATA[k] = inc[k]; }); if (inc.pinyin) DATA.pinyin = inc.pinyin; normalize(DATA); return 'Đã thay thế dữ liệu.'; }
  (inc.vocab||[]).forEach(function(w){ if (!w || !w.hz) return; var ex = DATA.vocab.filter(function(x){ return x.hz === w.hz; })[0]; if (ex){ Object.keys(w).forEach(function(k){ if (w[k] !== '' && w[k] != null) ex[k] = w[k]; }); rep.updated++; } else { DATA.vocab.push(w); rep.added++; } });
  function byKey(list, key){ (inc[list]||[]).forEach(function(it){ var i = DATA[list].findIndex(function(x){ return x[key] === it[key]; }); if (i >= 0){ DATA[list][i] = it; rep.updated++; } else { DATA[list].push(it); rep.added++; } }); }
  byKey('days', 'day'); byKey('levels', 'level'); byKey('dialogues', 'title'); byKey('readings', 'title'); byKey('tests', 'week'); byKey('grammar', 'title');
  (inc.sentences||[]).forEach(function(s){ if (s && s.hz && !DATA.sentences.some(function(x){ return x.hz === s.hz; })){ DATA.sentences.push(s); rep.added++; } });
  if (inc.pron) DATA.pron = inc.pron; if (inc.pinyin) DATA.pinyin = inc.pinyin;
  normalize(DATA);
  return 'Thêm mới '+rep.added+' mục, cập nhật '+rep.updated+' mục.';
}
function buildHTML(){
  var json = JSON.stringify(Object.assign({}, DATA, {meta: Object.assign({}, DATA.meta, {version: new Date().toISOString().slice(0, 19)})})).replace(/</g, '\\u003c');
  var start = SHELL.indexOf('<script id="app-data" type="application/json">');
  var end = SHELL.indexOf('<\/script>', start);
  return SHELL.slice(0, start) + '<script id="app-data" type="application/json">' + json + SHELL.slice(end);
}
VIEWS.data = function(v){
  var c = function(k){ return DATA[k].length; };
  v.innerHTML = '<h1>Dữ liệu & cập nhật nội dung</h1><p class="lead">Thêm từ, hội thoại, ngữ pháp… bằng file JSON hoặc CSV. Sau khi cập nhật, bấm "Tải HTML hoàn chỉnh" để có một file mới chứa toàn bộ dữ liệu, mở là chạy.</p>'+
   '<div class="grid g6">'+[['vocab','từ vựng'],['sentences','mẫu câu'],['days','ngày học'],['dialogues','hội thoại'],['grammar','ngữ pháp'],['readings','bài đọc'],['tests','bài kiểm tra']].map(function(x){ return '<div class="card"><div class="stat">'+c(x[0])+'<small>'+x[1]+'</small></div></div>'; }).join('')+'</div>'+
   '<div class="card"><h3 style="margin-top:0">Nhập dữ liệu</h3><div class="row"><input type="file" id="dfile" accept=".json,.csv,.tsv,.txt"><label class="row"><input type="radio" name="dm" value="merge" checked> Gộp (thêm mới, cập nhật trùng)</label><label class="row"><input type="radio" name="dm" value="replace"> Thay thế các mục có trong file</label></div>'+
   '<p class="vi" style="font-size:13px">CSV: dòng đầu là tiêu đề cột <code>hz,py,vi,level,day,topic</code> (chấp nhận dấu phẩy, chấm phẩy hoặc tab). JSON: theo cấu trúc bên dưới, chỉ cần các phần muốn thêm.</p>'+
   '<textarea id="dpaste" placeholder="Hoặc dán JSON/CSV vào đây..."></textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="dimp">Nhập nội dung đã dán</button><span id="dmsg"></span></div></div>'+
   '<div class="card"><h3 style="margin-top:0">Xuất</h3><div class="row"><button class="btn pri" id="dhtml">⬇ Tải HTML hoàn chỉnh (kèm dữ liệu hiện tại)</button><button class="btn" id="djson">⬇ Tải dữ liệu JSON</button><button class="btn" id="dprog">⬇ Sao lưu tiến độ học</button><label class="btn" style="display:inline-block">⬆ Khôi phục tiến độ<input type="file" id="dprogin" accept=".json" style="display:none"></label></div></div>'+
   '<div class="card"><h3 style="margin-top:0">Đặt lại</h3><div class="row"><button class="btn" id="dreset" '+(CUSTOM?'':'disabled')+'>Khôi phục dữ liệu gốc của file</button><button class="btn" id="dpreset">Xóa tiến độ học</button></div></div>'+
   '<div class="card"><h3 style="margin-top:0">Cấu trúc JSON</h3><pre>'+esc(SCHEMA)+'</pre></div>';
  function msg(t){ $('#dmsg', v).textContent = t; toast(t); }
  function ingest(text, name){
    var mode = ($('input[name=dm]:checked', v) || {}).value, inc;
    try { inc = /^\s*[\[{]/.test(text) ? JSON.parse(text) : parseCSV(text); if (Array.isArray(inc)) inc = {vocab: inc}; }
    catch(e){ return msg('Không đọc được dữ liệu: ' + e.message); }
    var r = mergeData(inc, mode === 'replace'); saveData(); msg(r + ' (' + (name || 'nội dung dán') + ')'); setTimeout(route, 600);
  }
  $('#dfile', v).onchange = function(){ var f = this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ ingest(rd.result, f.name); }; rd.readAsText(f, 'utf-8'); };
  $('#dimp', v).onclick = function(){ var t = $('#dpaste', v).value.trim(); if (t) ingest(t); };
  $('#dhtml', v).onclick = function(){ download('tieng-trung-tai-chinh.html', buildHTML(), 'text/html'); };
  $('#djson', v).onclick = function(){ download('du-lieu-tieng-trung.json', JSON.stringify(DATA, null, 1), 'application/json'); };
  $('#dprog', v).onclick = function(){ download('tien-do-hoc.json', JSON.stringify({srs: SRS, prog: PROG, settings: S}), 'application/json'); };
  $('#dprogin', v).onchange = function(){ var f = this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ try{ var o = JSON.parse(rd.result); if (o.srs) { SRS = o.srs; store.set('srs', SRS); } if (o.prog){ PROG = o.prog; saveProg(); } toast('Đã khôi phục tiến độ'); route(); }catch(e){ toast('File không hợp lệ'); } }; rd.readAsText(f); };
  $('#dreset', v).onclick = function(){ if (!confirmBox('Khôi phục dữ liệu gốc? Nội dung đã nhập sẽ bị bỏ.')) return; store.del('data'); DATA = JSON.parse(DATA_TEXT); normalize(DATA); CUSTOM = false; buildIndex(); route(); toast('Đã khôi phục dữ liệu gốc'); };
  $('#dpreset', v).onclick = function(){ if (!confirmBox('Xóa toàn bộ tiến độ học (thẻ, điểm, ngày đã học)?')) return; SRS = {}; PROG = {days: {}, quiz: {right: 0, total: 0}, write: 0, streak: {last: '', n: 0}}; store.set('srs', SRS); saveProg(); route(); toast('Đã xóa tiến độ'); };
};
function confirmBox(m){ var b = $('#view').querySelector('[data-confirm]'); if (b && b.getAttribute('data-confirm') === m){ b.remove(); return true; } if (b) b.remove(); var d = document.createElement('div'); d.className = 'notice'; d.setAttribute('data-confirm', m); d.textContent = m + ' Bấm lại nút lần nữa để xác nhận.'; $('#view').prepend(d); window.scrollTo(0, 0); return false; }

route();
})();
